"$schema" = "../node_modules/@tauri-apps/cli/config.schema.json"

productName = "Mira"
version = "../package.json"
identifier = "work.nyaacinth.app.mira"

[build]
frontendDist = "../dist"
devUrl = "http://localhost:5173"
beforeDevCommand = "bun run dev:vite"
beforeBuildCommand = "bun run build:vite"

[[app.windows]]
label = "main"
title = "Mira"
width = 300
height = 500
titleBarStyle = "Overlay"
hiddenTitle = true
resizable = true
fullscreen = false
visible = false
trafficLightPosition = { x = 11, y = 15 }

[app.security]
csp = "default-src 'self'; connect-src 'self' https: wss:; img-src 'self' https: data:; media-src 'self' https: data: blob:; script-src 'self'; style-src 'self' 'unsafe-inline' 'unsafe-eval'; font-src 'self';"
devCsp = "default-src * 'unsafe-inline' 'unsafe-eval'; connect-src *; img-src * data: blob:;"

[bundle]
active = true
targets = "all"
icon = [
    "icons/32x32.png",
    "icons/128x128.png",
    "icons/128x128@2x.png",
    "icons/icon.icns",
    "icons/icon.ico",
]

[bundle.macOS]
hardenedRuntime = true
entitlements = "./entitlements.plist"
